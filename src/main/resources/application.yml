spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    url: jdbc:postgresql://localhost:5432/flowtaskmanager
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
